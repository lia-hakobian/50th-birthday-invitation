
<!DOCTYPE html>
<html lang="hy">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#260b14">
  <title>Թամարան 50 է</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      background: #260b14;
    }

    body {
      min-height: 100vh;
      background: #260b14;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .invitation {
      width: 100%;
      max-width: 1536px;
      overflow: hidden;
    }

    .invitation img {
      display: block;
      width: 100%;
      height: auto;
    }

    @media (max-width: 600px) {
      .invitation {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <main class="invitation">
    <img
      src="invitation.jpg"
      alt="Թամարայի 50-ամյակի հրավեր"
    >
  </main>
</body>
</html>
